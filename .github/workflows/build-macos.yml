name: Build macOS Literature App

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS app (Intel via Rosetta, 10.14+)
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: 'x64'

      - name: Install dependencies
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install -r requirements.txt

      - name: Build macOS app
        run: |
          arch -x86_64 python -m PyInstaller --noconfirm --clean \
            --onefile \
            --windowed \
            --name literature \
            --collect-all customtkinter \
            main_v4_clean.py

      - name: Zip artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/literature.app literature-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: literature-macos
          path: literature-macos.zip
